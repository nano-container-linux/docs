site_name: nano-container-linux docs
site_description: "A minimal container host — OCI initrd and PXE boot, a DNS daemon, an OpenPubKey agent."
site_url: https://nano-container-linux.github.io/docs/
repo_url: https://github.com/nano-container-linux
repo_name: nano-container-linux
edit_uri: ""

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    # First entry has no explicit light/dark, so it is the default: follow the system.
    - media: "(prefers-color-scheme)"
      toggle: { icon: material/brightness-auto, name: Switch to light mode }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: cyan
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      toggle: { icon: material/brightness-auto, name: Follow the system }

extra:
  version:
    provider: mike
    default: latest

nav:
  - Overview: index.md
  - Modules: modules.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.superfences
  - pymdownx.inlinehilite
